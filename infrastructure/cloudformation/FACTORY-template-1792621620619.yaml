  CloudFormationStackW9:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::CloudFormation::Stack"
    DeletionPolicy: "Retain"
    Properties:
      Description: "Three manually invoked MQTT command Lambdas and S3 message logging.\n"
      Parameters:
        ExistingBucketName: "sistemasciberfisicos"
        ThingName: "Sensor_sim"
        ExistingPrefix: "fabrica-data-lake-gold-salvador/gold/Operational_actions"
        IoTDataEndpoint: "a1w6y3r95yz410-ats.iot.us-east-2.amazonaws.com"
        ExistingTopic: "fabrica/maquinas/telemetria"
      Capabilities:
      - "CAPABILITY_IAM"
      EnableTerminationProtection: false
      TemplateBody: "\nDescription: >\n  Three manually invoked MQTT command Lambdas\
        \ and S3 message logging.\n\nParameters:\n  ExistingTopic:\n    Type: String\n\
        \    Description: Existing MQTT topic name, without leading slash\n\n  ThingName:\n\
        \    Type: String\n    Description: Existing AWS IoT Thing name\n\n  IoTDataEndpoint:\n\
        \    Type: String\n    Description: >\n      IoT Data endpoint hostname, e.g.\n\
        \      abc123-ats.iot.us-east-1.amazonaws.com\n  \n  ExistingBucketName:\n\
        \    Type: String\n    Default: sistemasciberfisicos\n\n  ExistingPrefix:\n\
        \    Type: String\n    Default: fabrica-data-lake-gold-salvador/gold/Operational_actions\n\
        \nResources:\n\n  # IoT Core assumes this role to write messages to S3\n \
        \ IoTLoggingRole:\n    Type: AWS::IAM::Role\n    Properties:\n      AssumeRolePolicyDocument:\n\
        \        Version: '2012-10-17'\n        Statement:\n          - Effect: Allow\n\
        \            Principal:\n              Service: iot.amazonaws.com\n      \
        \      Action: sts:AssumeRole\n      Policies:\n        - PolicyName: WriteMqttLogs\n\
        \          PolicyDocument:\n            Version: '2012-10-17'\n          \
        \  Statement:\n              - Effect: Allow\n                Action:\n  \
        \                - s3:PutObject\n                Resource: !Sub\n        \
        \          - '${BucketArn}/${Prefix}/*'\n                  - BucketArn: !Sub\
        \ 'arn:${AWS::Partition}:s3:::${ExistingBucketName}'\n                   \
        \ Prefix: !Ref ExistingPrefix\n\n  # Every published message on the existing\
        \ topic is logged\n  MqttLoggingRule:\n    Type: AWS::IoT::TopicRule\n   \
        \ Properties:\n      RuleName: !Sub 'ManualMqttLogging_${AWS::StackName}'\n\
        \      TopicRulePayload:\n        AwsIotSqlVersion: '2016-03-23'\n       \
        \ Sql: !Sub \"SELECT *, topic() AS mqtt_topic, timestamp() AS received_at\
        \ FROM '${ExistingTopic}'\"\n        RuleDisabled: false\n        Actions:\n\
        \          - S3:\n              BucketName: !Ref ExistingBucketName\n    \
        \          Key: !Sub '${ExistingPrefix}/\\${!timestamp()}-\\${!newuuid()}.json'\n\
        \              RoleArn: !GetAtt IoTLoggingRole.Arn\n\n  # Shared least-privilege\
        \ role for the three functions\n  MqttLambdaRole:\n    Type: AWS::IAM::Role\n\
        \    Properties:\n      AssumeRolePolicyDocument:\n        Version: '2012-10-17'\n\
        \        Statement:\n          - Effect: Allow\n            Principal:\n \
        \             Service: lambda.amazonaws.com\n            Action: sts:AssumeRole\n\
        \      ManagedPolicyArns:\n        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'\n\
        \      Policies:\n        - PolicyName: PublishConfiguredTopic\n         \
        \ PolicyDocument:\n            Version: '2012-10-17'\n            Statement:\n\
        \              - Effect: Allow\n                Action:\n                \
        \  - iot:Publish\n                Resource:\n                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/${ExistingTopic}'\n\
        \n  # Lambda 1: publish total-stop command\n  StopAllLambda:\n    Type: AWS::Lambda::Function\n\
        \    Properties:\n      FunctionName: iot_paro_total\n      Runtime: python3.12\n\
        \      Handler: index.handler\n      Timeout: 10\n      Role: !GetAtt MqttLambdaRole.Arn\n\
        \      Environment:\n        Variables:\n          MQTT_TOPIC: !Ref ExistingTopic\n\
        \          IOT_ENDPOINT: !Ref IoTDataEndpoint\n          THING_NAME: !Ref\
        \ ThingName\n      Code:\n        ZipFile: |\n          import json\n    \
        \      import os\n          import boto3\n          from datetime import datetime,\
        \ timezone\n\n          def handler(event, context):\n              if event.get(\"\
        confirm\") != \"STOP_ALL\":\n                  raise ValueError(\n       \
        \               \"Explicit confirmation required: confirm=STOP_ALL\"\n   \
        \               )\n\n              client = boto3.client(\n              \
        \    \"iot-data\",\n                  endpoint_url=\"https://\" + os.environ[\"\
        IOT_ENDPOINT\"]\n              )\n              payload = {\n            \
        \      \"command_id\": context.aws_request_id,\n                  \"action\"\
        : \"STOP_ALL\",\n                  \"thing\": os.environ[\"THING_NAME\"],\n\
        \                  \"issued_at\": datetime.now(timezone.utc).isoformat(),\n\
        \                  \"source\": \"manual-lambda\"\n              }\n      \
        \        client.publish(\n                  topic=os.environ[\"MQTT_TOPIC\"\
        ],\n                  qos=1,\n                  payload=json.dumps(payload)\n\
        \              )\n              return {\"status\": \"published\", \"command\"\
        : payload}\n\n  # Lambda 2: publish a single-device stop command\n  StopDeviceLambda:\n\
        \    Type: AWS::Lambda::Function\n    Properties:\n      FunctionName: iot-paro-individual\n\
        \      Runtime: python3.12\n      Handler: index.handler\n      Timeout: 10\n\
        \      Role: !GetAtt MqttLambdaRole.Arn\n      Environment:\n        Variables:\n\
        \          MQTT_TOPIC: !Ref ExistingTopic\n          IOT_ENDPOINT: !Ref IoTDataEndpoint\n\
        \          THING_NAME: !Ref ThingName\n      Code:\n        ZipFile: |\n \
        \         import json\n          import os\n          import boto3\n     \
        \     from datetime import datetime, timezone\n\n          def handler(event,\
        \ context):\n              device = event.get(\"device_id\")\n           \
        \   if not device:\n                  raise ValueError(\"device_id is required\"\
        )\n\n              if event.get(\"confirm\") != device:\n                \
        \  raise ValueError(\n                      \"Confirmation must match device_id\"\
        \n                  )\n\n              client = boto3.client(\n          \
        \        \"iot-data\",\n                  endpoint_url=\"https://\" + os.environ[\"\
        IOT_ENDPOINT\"]\n              )\n              payload = {\n            \
        \      \"command_id\": context.aws_request_id,\n                  \"action\"\
        : \"STOP_DEVICE\",\n                  \"device_id\": device,\n           \
        \       \"thing\": os.environ[\"THING_NAME\"],\n                  \"issued_at\"\
        : datetime.now(timezone.utc).isoformat(),\n                  \"source\": \"\
        manual-lambda\"\n              }\n              client.publish(\n        \
        \          topic=os.environ[\"MQTT_TOPIC\"],\n                  qos=1,\n \
        \                 payload=json.dumps(payload)\n              )\n         \
        \     return {\"status\": \"published\", \"command\": payload}\n\n  # Lambda\
        \ 3: intentionally non-operational until action is defined\n  CustomActionLambda:\n\
        \    Type: AWS::Lambda::Function\n    Properties:\n      FunctionName: iot-paro-accion_custom\n\
        \      Runtime: python3.12\n      Handler: index.handler\n      Timeout: 10\n\
        \      Role: !GetAtt MqttLambdaRole.Arn\n      Environment:\n        Variables:\n\
        \          MQTT_TOPIC: !Ref ExistingTopic\n          IOT_ENDPOINT: !Ref IoTDataEndpoint\n\
        \          THING_NAME: !Ref ThingName\n      Code:\n        ZipFile: |\n \
        \         def handler(event, context):\n              raise NotImplementedError(\n\
        \                  \"Define and validate the third action before deployment\
        \ use\"\n              )\n\nOutputs:\n  StopAllFunction:\n    Value: !Ref\
        \ StopAllLambda\n\n  StopDeviceFunction:\n    Value: !Ref StopDeviceLambda\n\
        \n  CustomActionFunction:\n    Value: !Ref CustomActionLambda\n  \n  LogBucket:\n\
        \    Value: !Ref ExistingBucketName\n\n  LogBucketPath:\n    Value: !Sub 's3://${ExistingBucketName}/${ExistingPrefix}/'\n\
        \n  LoggingRule:\n    Value: !Ref MqttLoggingRule"
      DisableRollback: false
      StackName: "lambdas-test-iac3"
